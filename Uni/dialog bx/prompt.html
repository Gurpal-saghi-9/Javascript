<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt box</title>
</head>
<body>
    <script>
        let name = prompt("Enter your name: ");
        document.write("Hello " + name +"<br>");
        alert("You entered a type of name: " +  typeof name); // if we can add a number, it will be a string and also at the time of entering character, it will be a string.

        a = parseInt(prompt("Enter a number: "));
        document.write("You entered a number: " + a + "<br>");
        alert("You entered a type of number: " + typeof a); // if we can add a number, it will be a number and also at the time of entering character, it will be a string.
    </script>
</body>
</html>
