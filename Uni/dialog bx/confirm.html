<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confir box</title>
</head>
<body>
    <script>
        let result = confirm("Are you sure you want to write it to the page?");
        if(result){
            document.write("You want to write on this page.");
        }else{
            document.write("You don't want to write on this page");
        }
    </script>
</body>
</html>
